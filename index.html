<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akey Koffi Clément — Géomètre-Topographe & Géographe SIG</title>
<meta name="description" content="Portfolio d'Akey Koffi Clément, opérateur géomètre-topographe et géographe SIG." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  html, body, #root { margin:0; padding:0; min-height:100vh; background:#0D1321; }
  .font-display { font-family:'Space Grotesk', sans-serif; font-weight:600; }
  .font-mono { font-family:'JetBrains Mono', monospace; }
  .font-serif { font-family:'Newsreader', serif; }
  @keyframes driftContour { 0%{transform:translateX(0)} 50%{transform:translateX(6px)} 100%{transform:translateX(0)} }
  .contour-line { animation: driftContour 8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .contour-line { animation:none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- Simple line icons (no external icon library needed) ---------- */
const Icon = ({ children, size = 18, className = "", ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...rest}>
    {children}
  </svg>
);
const Home = (p) => <Icon {...p}><path d="M3 9.5 12 3l9 6.5" /><path d="M5 10v10h14V10" /></Icon>;
const User = (p) => <Icon {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" /></Icon>;
const Compass = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="m15 9-3 3-3 3 3-3 3-3" /></Icon>;
const Map = (p) => <Icon {...p}><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" /><path d="M9 4v14M15 6v14" /></Icon>;
const Mail = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></Icon>;
const Phone = (p) => <Icon {...p}><path d="M6 3h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2Z" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M12 21s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12Z" /><circle cx="12" cy="9" r="2.5" /></Icon>;
const Triangle = (p) => <Icon {...p}><path d="M12 3 2 21h20L12 3Z" /></Icon>;
const Languages = (p) => <Icon {...p}><path d="M4 5h9M9 3v2M6 8a10 10 0 0 0 6 6M12 8a12 12 0 0 1-8 8" /><path d="m15 21 4-9 4 9M16.5 18h5" /></Icon>;
const Heart = (p) => <Icon {...p}><path d="M12 20s-7-4.4-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9Z" /></Icon>;

const TABS = [
  { id: "accueil", label: "Accueil", icon: Home },
  { id: "apropos", label: "À propos", icon: User },
  { id: "competences", label: "Compétences", icon: Compass },
  { id: "projets", label: "Projets", icon: Map },
  { id: "contact", label: "Contact", icon: Mail },
];

function ContourBackdrop() {
  const lines = Array.from({ length: 9 }, (_, i) => i);
  return (
    <svg className="absolute inset-0 w-full h-full opacity-[0.16] pointer-events-none" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
      {lines.map((i) => (
        <ellipse key={i} cx={200 + (i % 2 === 0 ? -20 : 20)} cy={60 + i * 42} rx={260 - i * 6} ry={40 + i * 3}
          fill="none" stroke={i % 3 === 0 ? "#C9A66B" : "#5C8374"} strokeWidth="1"
          className="contour-line" style={{ animationDelay: `${i * 0.4}s` }} />
      ))}
    </svg>
  );
}

const Eyebrow = ({ children }) => (
  <div className="font-mono text-[11px] tracking-[0.2em] uppercase text-[#C9A66B] flex items-center gap-2 mb-3">
    <span className="w-4 h-px bg-[#C9A66B]" />{children}
  </div>
);

const Card = ({ children, className = "" }) => (
  <div className={`rounded-2xl border border-[#C9A66B29] bg-[#141B2E] p-5 ${className}`}
       style={{ boxShadow: "0 8px 24px -12px rgba(0,0,0,0.5)" }}>{children}</div>
);

const SkillRow = ({ name, sub }) => (
  <div className="flex items-center justify-between py-3 border-b border-[#ffffff0f] last:border-0">
    <span className="text-[#F1EDE4] font-medium">{name}</span>
    {sub && <span className="font-mono text-[10px] text-[#93A0B8] uppercase tracking-wider">{sub}</span>}
  </div>
);

function AccueilTab() {
  return (
    <div className="relative min-h-[70vh] flex flex-col justify-center px-6 py-10 overflow-hidden">
      <ContourBackdrop />
      <div className="relative z-10">
        <Eyebrow>N 6.1319° · E 1.2228° — Agoè, Lomé</Eyebrow>
        <h1 className="font-display text-[2.6rem] leading-[1.05] text-[#F1EDE4] mb-3">Akey Koffi<br />Clément</h1>
        <p className="text-[#93A0B8] font-serif text-lg mb-1">Opérateur Géomètre-Topographe</p>
        <p className="text-[#5C8374] font-serif text-lg italic mb-6">&amp; Géographe SIG</p>
        <p className="text-[#c7cad6] leading-relaxed mb-8 max-w-md">
          Du levé de terrain à la carte finie : analyse spatiale, SIG et topographie au service de l'aménagement du territoire.
        </p>
        <div className="flex flex-wrap gap-3">
          <a href="#" onClick={(e) => { e.preventDefault(); document.dispatchEvent(new CustomEvent("navtab", { detail: "competences" })); }}
             className="px-5 py-3 rounded-full bg-[#C9A66B] text-[#0D1321] font-semibold text-sm hover:brightness-110 transition">Voir les compétences</a>
          <a href="#" onClick={(e) => { e.preventDefault(); document.dispatchEvent(new CustomEvent("navtab", { detail: "contact" })); }}
             className="px-5 py-3 rounded-full border border-[#C9A66B60] text-[#F1EDE4] font-semibold text-sm hover:bg-[#ffffff08] transition">Me contacter</a>
        </div>
      </div>
    </div>
  );
}

function AProposTab() {
  return (
    <div className="px-6 py-10">
      <Eyebrow>Repère 002 — Profil</Eyebrow>
      <h2 className="font-display text-3xl text-[#F1EDE4] mb-6">À propos de moi</h2>
      <Card className="mb-4">
        <p className="text-[#c7cad6] leading-relaxed">
          Opérateur géomètre-topographe et titulaire d'une licence en géographie, je dispose d'une solide familiarisation
          avec les Systèmes d'Information Géographique (SIG) et l'analyse spatiale. Habitué aux travaux de terrain, à la
          gestion du matériel de mesure et aux outils DAO/SIG (QGIS, AutoCAD), je souhaite intégrer une structure pour
          contribuer activement aux études topographiques et d'aménagement.
        </p>
      </Card>
      <p className="font-serif italic text-[#5C8374] text-center my-8 px-4">"L'innovation naît de la passion et de la persévérance."</p>
      <Eyebrow>Repère 003 — Parcours</Eyebrow>
      <div className="space-y-4">
        <Card>
          <div className="flex justify-between items-start mb-1">
            <h3 className="text-[#F1EDE4] font-semibold">Attestation d'Opérateur Topographe</h3>
            <span className="font-mono text-[10px] text-[#C9A66B] whitespace-nowrap ml-2">2025–2026</span>
          </div>
          <p className="text-[#93A0B8] text-sm">Institut Formatec</p>
        </Card>
        <Card>
          <div className="flex justify-between items-start mb-1">
            <h3 className="text-[#F1EDE4] font-semibold">Licence Fondamentale en Géographie</h3>
            <span className="font-mono text-[10px] text-[#C9A66B] whitespace-nowrap ml-2">2021–2025</span>
          </div>
          <p className="text-[#93A0B8] text-sm">Université de Lomé</p>
        </Card>
      </div>
      <div className="mt-8"><Eyebrow>Repère 004 — Certifications</Eyebrow></div>
      <div className="space-y-3">
        {["Introduction à la gestion du cycle de projet","Suivi et évaluation d'un projet de développement (Groupe AFD)","Réseautage professionnel","Gestion de projet Agile","Site Web efficace"].map((c) => (
          <div key={c} className="flex items-start gap-3">
            <Triangle size={12} className="text-[#5C8374] mt-1 shrink-0" />
            <span className="text-[#c7cad6] text-sm">{c}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function CompetencesTab() {
  return (
    <div className="px-6 py-10">
      <Eyebrow>Repère 010 — Boîte à outils</Eyebrow>
      <h2 className="font-display text-3xl text-[#F1EDE4] mb-6">Compétences</h2>
      <Card className="mb-4">
        <h3 className="font-mono text-xs uppercase tracking-wider text-[#5C8374] mb-2">Informatique &amp; SIG</h3>
        <SkillRow name="QGIS" sub="Analyse spatiale" />
        <SkillRow name="AutoCAD" sub="DAO" />
        <SkillRow name="KoboToolbox" sub="Collecte numérique" />
        <SkillRow name="Google Earth Pro" sub="Cartographie" />
      </Card>
      <Card className="mb-4">
        <h3 className="font-mono text-xs uppercase tracking-wider text-[#5C8374] mb-2">Terrain &amp; gestion</h3>
        <SkillRow name="Topographie" sub="Levé · Traitement · Implantation" />
        <SkillRow name="Gestion de projet Agile" />
        <SkillRow name="Suivi et évaluation" />
      </Card>
      <Card className="mb-4">
        <h3 className="font-mono text-xs uppercase tracking-wider text-[#5C8374] mb-2 flex items-center gap-2"><Languages size={13} /> Langues</h3>
        <SkillRow name="Français" sub="Courant" />
        <SkillRow name="Éwé" sub="Courant" />
        <SkillRow name="Anglais" sub="Niveau scolaire" />
      </Card>
      <Card>
        <h3 className="font-mono text-xs uppercase tracking-wider text-[#5C8374] mb-2 flex items-center gap-2"><Heart size={13} /> Centres d'intérêt</h3>
        <div className="flex flex-wrap gap-2 mt-2">
          {["Voyage", "Technologie", "Travail d'équipe"].map((t) => (
            <span key={t} className="px-3 py-1 rounded-full border border-[#C9A66B40] text-[#F1EDE4] text-xs font-mono">{t}</span>
          ))}
        </div>
      </Card>
    </div>
  );
}

function ProjetsTab() {
  return (
    <div className="px-6 py-10">
      <Eyebrow>Repère 020 — Travaux</Eyebrow>
      <h2 className="font-display text-3xl text-[#F1EDE4] mb-6">Projets</h2>
      <Card className="mb-4">
        <div className="flex items-center justify-between mb-2">
          <span className="font-mono text-[10px] uppercase tracking-wider text-[#C9A66B]">Étude de cas SIG</span>
          <Map size={16} className="text-[#5C8374]" />
        </div>
        <h3 className="text-[#F1EDE4] font-semibold text-lg mb-2">Cartographie des points d'eau (PMH)</h3>
        <p className="text-[#c7cad6] text-sm leading-relaxed mb-3">
          Analyse spatiale sous QGIS pour identifier les villages prioritaires sans accès à l'eau au sein de limites
          préfectorales hexagonales : zones tampons, intersection spatiale, et automatisation du traitement via le
          Modeleur graphique (Graphical Modeler).
        </p>
        <div className="flex flex-wrap gap-2">
          {["QGIS", "Buffer", "Intersection spatiale", "Graphical Modeler"].map((t) => (
            <span key={t} className="px-2.5 py-1 rounded-md bg-[#0D1321] border border-[#ffffff0f] text-[#93A0B8] text-[10px] font-mono">{t}</span>
          ))}
        </div>
      </Card>
      <Card className="border-dashed opacity-70">
        <p className="text-[#93A0B8] text-sm text-center py-4">D'autres projets seront ajoutés prochainement — levés topographiques, implantations, missions terrain.</p>
      </Card>
    </div>
  );
}

function ContactTab() {
  return (
    <div className="px-6 py-10">
      <Eyebrow>Repère 030 — Coordonnées</Eyebrow>
      <h2 className="font-display text-3xl text-[#F1EDE4] mb-6">Contact</h2>
      <div className="space-y-3">
        <a href="tel:+22897257151" className="flex items-center gap-4 p-4 rounded-2xl border border-[#C9A66B29] bg-[#141B2E] hover:bg-[#1B2438] transition">
          <Phone size={18} className="text-[#C9A66B] shrink-0" />
          <div><p className="text-[#F1EDE4] text-sm font-medium">97 25 71 51 / 70 02 80 63</p><p className="text-[#93A0B8] text-xs font-mono">Téléphone</p></div>
        </a>
        <a href="mailto:clementakey@gmail.com" className="flex items-center gap-4 p-4 rounded-2xl border border-[#C9A66B29] bg-[#141B2E] hover:bg-[#1B2438] transition">
          <Mail size={18} className="text-[#C9A66B] shrink-0" />
          <div><p className="text-[#F1EDE4] text-sm font-medium">clementakey@gmail.com</p><p className="text-[#93A0B8] text-xs font-mono">Email</p></div>
        </a>
        <div className="flex items-center gap-4 p-4 rounded-2xl border border-[#C9A66B29] bg-[#141B2E]">
          <MapPin size={18} className="text-[#C9A66B] shrink-0" />
          <div><p className="text-[#F1EDE4] text-sm font-medium">Agoè Plateau, Lomé — Togo</p><p className="text-[#93A0B8] text-xs font-mono">Localisation</p></div>
        </div>
      </div>
      <p className="text-center text-[#5C8374] font-serif italic text-sm mt-10">Disponible pour missions topographiques &amp; études SIG</p>
    </div>
  );
}

function Portfolio() {
  const [active, setActive] = useState("accueil");
  const scrollRef = useRef(null);

  useEffect(() => {
    const handler = (e) => setActive(e.detail);
    document.addEventListener("navtab", handler);
    return () => document.removeEventListener("navtab", handler);
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: "smooth" });
  }, [active]);

  const renderTab = () => {
    switch (active) {
      case "accueil": return <AccueilTab />;
      case "apropos": return <AProposTab />;
      case "competences": return <CompetencesTab />;
      case "projets": return <ProjetsTab />;
      case "contact": return <ContactTab />;
      default: return <AccueilTab />;
    }
  };

  return (
    <div className="w-full min-h-screen bg-[#0D1321] flex flex-col" style={{ fontFamily: "'Newsreader', serif" }}>
      <div className="flex items-center gap-2 px-6 py-4 border-b border-[#ffffff0d]">
        <div className="w-8 h-8 rounded-lg bg-[#C9A66B] flex items-center justify-center">
          <Triangle size={14} className="text-[#0D1321]" />
        </div>
        <span className="font-display text-[#F1EDE4] text-sm tracking-wide">AKEY&nbsp;K.&nbsp;CLÉMENT</span>
      </div>
      <div ref={scrollRef} className="flex-1">{renderTab()}</div>
      <div className="flex items-stretch border-t border-[#ffffff0d] bg-[#0B0F1A] sticky bottom-0">
        {TABS.map((t) => {
          const IconC = t.icon;
          const isActive = active === t.id;
          return (
            <button key={t.id} onClick={() => setActive(t.id)} className="flex-1 flex flex-col items-center justify-center gap-1 py-3 transition">
              <IconC size={18} className={isActive ? "text-[#C9A66B]" : "text-[#5B6478]"} />
              <span className={`text-[10px] font-mono ${isActive ? "text-[#C9A66B]" : "text-[#5B6478]"}`}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portfolio />);
</script>
</body>
</html>
